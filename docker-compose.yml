services:  redis:    image: redis:7-alpine    container_name: max-bot-redis    restart: unless-stopped    volumes:      - redis-data:/data    networks:      - default  backend:    build: .    container_name: max-bot-backend    restart: unless-stopped    env_file:      - .env    environment:      - REDIS_HOST=redis      - REDIS_PORT=6379      - REDIS_DB=0      - DB_PATH=/app/data/tenants.db    ports:      - "8000:8000"    depends_on:      - redis    volumes:      - ./data:/app/data    dns:      - 8.8.8.8      - 1.1.1.1    networks:      - defaultnetworks:  default:    driver: bridge    driver_opts:      com.docker.network.driver.mtu: 1450volumes:  redis-data: